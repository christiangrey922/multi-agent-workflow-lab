id: reviewer
name: Reviewer
description: Reviews evidence, process, and output quality.
role: reviewer
capabilities: [review, verification]
systemPrompt: agents.reviewer
systemPromptVersion: 1.0.0
allowedTools: [workflow.inspect]
allowedMcpServers: []
permissionProfile:
  grants: [context:public, context:workflow, task:create]
  denied: [secret:read]
  allowSecrets: false
delegationPolicy:
  allowed: true
  maxDepth: 4
  allowedTargets: [evaluator]
  allowedCapabilities: [evaluation]
  maxChildTasks: 1
model:
  provider: mock
  model: deterministic-v1
  temperature: 0
executionLimits:
  maxAgentTurns: 5
  maxToolCalls: 5
  maxRetries: 1
  maxRuntimeMs: 30000
  maxTokenBudget: 10000
metadata:
  owner: core
