id: evaluator
name: Evaluator
description: Evaluates delegation correctness and final output acceptance.
role: evaluator
capabilities: [evaluation, policy-audit]
systemPrompt: agents.evaluator
systemPromptVersion: 1.0.0
allowedTools: [workflow.inspect]
allowedMcpServers: []
permissionProfile:
  grants: [context:public, context:workflow]
  denied: [task:create, secret:read]
  allowSecrets: false
delegationPolicy:
  allowed: false
  maxDepth: 0
  allowedTargets: []
  allowedCapabilities: []
  maxChildTasks: 0
model:
  provider: mock
  model: deterministic-v1
  temperature: 0
executionLimits:
  maxAgentTurns: 5
  maxToolCalls: 5
  maxRetries: 0
  maxRuntimeMs: 30000
  maxTokenBudget: 10000
metadata:
  owner: core
