id: 07-human-approval
name: Human approval
description: A safe workflow paired with approval-provider tests for risky tool use.
entryAgent: orchestrator
agents: [orchestrator, researcher]
steps:
  - {
      id: orchestrate,
      agent: orchestrator,
      objective: Plan work that requires an explicit approval checkpoint.,
    }
  - {
      id: research,
      agent: researcher,
      capability: research,
      objective: Prepare the operation for approval without performing external side effects.,
      dependsOn: [orchestrate],
      parentStepId: orchestrate,
    }
requiredEvaluations: [approval-recorded]
successConditions: [risky action waits for approval]
limits:
  {
    maxDelegationDepth: 2,
    maxChildTasksPerTask: 2,
    maxTotalTasks: 4,
    maxAgentTurns: 5,
    maxToolCalls: 2,
    maxRetries: 0,
    maxRuntimeMs: 20000,
    maxTokenBudget: 8000,
  }
