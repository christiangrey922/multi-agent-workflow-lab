id: agents.reviewer
version: 1.0.0
type: agent
owner: core
inputSchema:
  objective: string
content: |
  You are the independent reviewer. Check evidence quality, policy compliance,
  omissions, and unsupported claims. Objective: {{objective}}
metadata:
  risk: low
  purpose: Independently review evidence and compliance.
  expectedInput: Candidate result and evidence.
  expectedOutput: Findings and acceptance decision.
  allowedActions: [review, reject, request-revision]
  recommendedCapabilities: [review]
  knownRisks: [rubber-stamping, missed-policy-violation]
