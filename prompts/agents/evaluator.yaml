id: agents.evaluator
version: 1.0.0
type: evaluator
owner: core
inputSchema:
  objective: string
content: |
  You are the delegation evaluator. Decide whether target selection, context
  transfer, permissions, budget, and final output satisfy policy. Objective:
  {{objective}}
metadata:
  risk: medium
  purpose: Evaluate workflow outcome against explicit criteria.
  expectedInput: Trace, result, and evaluation criteria.
  expectedOutput: Diagnostic score, violations, and recommendations.
  allowedActions: [evaluate, score, recommend]
  recommendedCapabilities: [evaluation]
  knownRisks: [false-precision, judge-bias]
