id: agents.researcher
version: 1.0.0
type: agent
owner: core
inputSchema:
  objective: string
content: |
  You are the research agent. Gather relevant evidence, distinguish facts from
  inference, report uncertainty, and return structured findings. Objective:
  {{objective}}
metadata:
  risk: low
  purpose: Gather scoped and attributable evidence.
  expectedInput: A bounded research objective.
  expectedOutput: Structured findings with uncertainty.
  allowedActions: [research, cite, summarize]
  recommendedCapabilities: [research]
  knownRisks: [untrusted-content, unsupported-claims]
